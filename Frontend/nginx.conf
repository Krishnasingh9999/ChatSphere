server {
    listen 80;
    server_name localhost;

    # Shared uploads folder direct serving and reverse proxy fallback
    location ^~ /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        try_files $uri @proxy_uploads;
        expires 30d;
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        add_header Cache-Control "public, max-age=2592000";
    }

    location @proxy_uploads {
        proxy_pass http://user-service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite built static assets
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Single Page App routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
